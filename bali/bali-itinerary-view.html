<style>
  :root{
    --bg:#0E2A22; --bg-deep:#0A2119; --card:#153A2D; --card-hi:#1B4636;
    --gold:#E3B23C; --coral:#F0785A; --jade:#7FC29B; --sand:#F4ECD8;
    --muted:#94AFA1; --line:#26523F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--sand); font-family:'Public Sans', sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:70px;}
  .hero{padding:36px 20px 20px; background:radial-gradient(120% 100% at 15% 0%, rgba(227,178,60,0.18), transparent 55%), radial-gradient(120% 100% at 85% 10%, rgba(240,120,90,0.14), transparent 55%), var(--bg-deep); border-bottom:1px solid var(--line);}
  .hero-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .hero-eyebrow{font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--jade); margin-bottom:8px;}
  .hero h1{font-family:'Fraunces', serif; font-weight:600; font-size:clamp(38px, 11vw, 52px); line-height:0.95; color:var(--sand); letter-spacing:-0.01em;}
  .hero-sub{margin-top:10px; color:var(--muted); font-size:14px; max-width:38ch; line-height:1.5;}
  .hero-meta{margin-top:14px; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--gold);}
  .daynav{position:sticky; top:0; z-index:30; display:flex; gap:6px; padding:12px 16px; background:rgba(14,42,34,0.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;}
  .daynav::-webkit-scrollbar{display:none;}
  .daynav a{flex:0 0 auto; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted); text-decoration:none; padding:7px 12px; border-radius:20px; border:1px solid var(--line); white-space:nowrap;}
  .daynav a:hover{color:var(--sand); border-color:var(--gold);}

  main{max-width:640px; margin:0 auto; padding:8px 0 0;}
  section.day{padding:30px 20px 6px; position:relative;}
  section.day.leg-ubud{--leg:var(--jade);}
  section.day.leg-seminyak{--leg:var(--coral);}
  section.day.leg-flight{--leg:var(--gold);}
  .day-head{display:flex; align-items:baseline; gap:12px; margin-bottom:4px;}
  .day-label{font-family:'Fraunces', serif; font-weight:600; font-size:24px; color:var(--sand);}
  .day-tag{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--leg, var(--gold)); border:1px solid var(--leg, var(--gold)); padding:3px 8px; border-radius:20px;}
  .day-sub{font-size:13px; color:var(--muted); margin-bottom:18px;}

  .timeline{position:relative; padding-left:28px;}
  .timeline::before{content:""; position:absolute; left:9px; top:4px; bottom:4px; width:2px; background:linear-gradient(to bottom, var(--leg, var(--gold)), var(--line) 90%); opacity:0.6;}
  .stop{position:relative; padding-bottom:20px;}
  .stop:last-child{padding-bottom:4px;}
  .stop-icon{position:absolute; left:-28px; top:1px; width:20px; height:20px; border-radius:50%; background:var(--card-hi); border:1.5px solid var(--leg, var(--gold)); display:flex; align-items:center; justify-content:center;}
  .stop-icon svg{width:11px; height:11px; stroke:var(--sand); fill:none; stroke-width:1.8;}
  .stop-body{display:flex; gap:12px; align-items:flex-start;}
  .stop-thumb{flex:0 0 auto; width:56px; height:56px; border-radius:10px; overflow:hidden; border:1px solid var(--line);}
  .stop-thumb svg{width:100%; height:100%; display:block;}
  .stop-text{flex:1; min-width:0;}
  .stop-time{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--leg, var(--gold)); margin-bottom:3px;}
  .stop-name{font-size:16px; font-weight:600; color:var(--sand); margin-bottom:3px;}
  .stop-blurb{font-size:13.5px; color:var(--muted); line-height:1.45; max-width:46ch;}
  .stop-map{margin-top:5px; font-family:'IBM Plex Mono', monospace; font-size:12px;}
  .stop-map a{color:var(--jade); text-decoration:none; border-bottom:1px solid var(--line);}
  .stop-map a:hover{color:var(--gold);}
  .stop-dist{color:var(--muted);}
  .day-hotel{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--leg, var(--gold)); margin:-10px 0 16px;}

  .links-list{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .links-list a{color:var(--jade); font-size:14px; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:10px; display:block;}

  .ubud-links-list{display:flex; flex-direction:column; gap:12px; margin-top:14px;}
  .ubud-links-list a{color:inherit; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:10px; display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .ubud-link-name{color:var(--jade); font-size:14px;}
  .ubud-link-dist{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted); white-space:nowrap; flex:0 0 auto;}

  .divider{max-width:640px; margin:8px auto 0; padding:0 20px;}
  .divider hr{border:none; height:1px; background:linear-gradient(to right, transparent, var(--line), transparent);}
  footer{max-width:640px; margin:30px auto 0; padding:0 20px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); text-align:center;}
  .loading{padding:60px 20px; text-align:center; color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:13px;}
</style>
</head>

const data = defaultData;

function esc(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function renderNav(){
  document.getElementById('dayNav').innerHTML = data.map(d => {
    const short = d.date.replace(/^\w+,\s*/, '');
    return `<a href="#${d.id}">${short}</a>`;
  }).join('');
}

function stopView(stop){
  const thumb = stop.photo ? `<div class="stop-thumb"><svg viewBox="0 0 64 64">${THUMBS[stop.photo] || ''}</svg></div>` : '';
  return `
    <div class="stop">
      <div class="stop-icon"><svg viewBox="0 0 24 24">${ICONS[stop.icon] || ICONS.free}</svg></div>
      <div class="stop-body">
        ${thumb}
        <div class="stop-text">
          <div class="stop-time">${esc(stop.time)}</div>
          <div class="stop-name">${esc(stop.name)}</div>
          ${stop.blurb ? `<div class="stop-blurb">${esc(stop.blurb)}</div>` : ''}
          ${stop.maps ? `<div class="stop-map"><a href="${stop.maps}" target="_blank" rel="noopener">View on Google Maps</a>${stop.dist ? ` <span class="stop-dist">· ${esc(stop.dist)} from hotel</span>` : ''}</div>` : ''}
          ${stop.fromPrev ? `<div class="stop-map"><span class="stop-dist">↳ ${esc(stop.fromPrev)}</span></div>` : ''}
        </div>
      </div>
    </div>`;
}

function dayView(day){
  const stopsHtml = day.stops.map(s => stopView(s)).join('');
  return `
    <section class="day leg-${day.leg}" id="${day.id}">
      <div class="day-head">
        <span class="day-label">${esc(day.date)}</span>
        <span class="day-tag">${esc(day.tag)}</span>
      </div>
      <div class="day-sub">${esc(day.sub)}</div>
      ${day.hotel ? `<div class="day-hotel">Distances below from: ${esc(day.hotel)}</div>` : ''}
      <div class="timeline">${stopsHtml}</div>
    </section>
    <div class="divider"><hr></div>`;
}

function linksView(){
  const items = LINKS.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');
  return `
    <section class="day">
      <div class="day-head"><span class="day-label" style="font-size:22px;">Helpful Links</span></div>
      <div class="links-list">${items}</div>
    </section>`;
}

function ubudLinksView(){
  const items = UBUD_LINKS.map(l => `
    <a href="${l.url}" target="_blank" rel="noopener">
      <span class="ubud-link-name">${esc(l.label)}</span>
      <span class="ubud-link-dist">${esc(l.distance)}</span>
    </a>`).join('');
  return `
    <section class="day">
      <div class="day-head"><span class="day-label" style="font-size:22px;">Ubud Links</span></div>
      <div class="day-sub">Google Maps links + estimated distance/time from Maya Ubud Resort &amp; Spa.</div>
      <div class="ubud-links-list">${items}</div>
    </section>`;
}

function render(){
  renderNav();
  const app = document.getElementById('app');
  app.innerHTML = data.map(d => dayView(d)).join('') + ubudLinksView() + linksView();
}

render();
</script>
