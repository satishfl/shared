<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — Aug 20–30, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E2A22; --bg-deep:#0A2119; --card:#153A2D; --card-hi:#1B4636;
    --gold:#E3B23C; --coral:#F0785A; --jade:#7FC29B; --sand:#F4ECD8;
    --muted:#94AFA1; --line:#26523F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--sand); font-family:'Public Sans', sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:70px;}
  .hero{padding:36px 20px 20px; background:radial-gradient(120% 100% at 15% 0%, rgba(227,178,60,0.18), transparent 55%), radial-gradient(120% 100% at 85% 10%, rgba(240,120,90,0.14), transparent 55%), var(--bg-deep); border-bottom:1px solid var(--line);}
  .hero-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .hero-eyebrow{font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--jade); margin-bottom:8px;}
  .hero h1{font-family:'Fraunces', serif; font-weight:600; font-size:clamp(38px, 11vw, 52px); line-height:0.95; color:var(--sand); letter-spacing:-0.01em;}
  .hero-sub{margin-top:10px; color:var(--muted); font-size:14px; max-width:38ch; line-height:1.5;}
  .hero-meta{margin-top:14px; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--gold);}
  .daynav{position:sticky; top:0; z-index:30; display:flex; gap:6px; padding:12px 16px; background:rgba(14,42,34,0.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;}
  .daynav::-webkit-scrollbar{display:none;}
  .daynav a{flex:0 0 auto; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted); text-decoration:none; padding:7px 12px; border-radius:20px; border:1px solid var(--line); white-space:nowrap;}
  .daynav a:hover{color:var(--sand); border-color:var(--gold);}

  main{max-width:640px; margin:0 auto; padding:8px 0 0;}
  section.day{padding:30px 20px 6px; position:relative;}
  section.day.leg-ubud{--leg:var(--jade);}
  section.day.leg-seminyak{--leg:var(--coral);}
  section.day.leg-flight{--leg:var(--gold);}
  .day-head{display:flex; align-items:baseline; gap:12px; margin-bottom:4px;}
  .day-label{font-family:'Fraunces', serif; font-weight:600; font-size:24px; color:var(--sand);}
  .day-tag{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--leg, var(--gold)); border:1px solid var(--leg, var(--gold)); padding:3px 8px; border-radius:20px;}
  .day-sub{font-size:13px; color:var(--muted); margin-bottom:18px;}

  .timeline{position:relative; padding-left:28px;}
  .timeline::before{content:""; position:absolute; left:9px; top:4px; bottom:4px; width:2px; background:linear-gradient(to bottom, var(--leg, var(--gold)), var(--line) 90%); opacity:0.6;}
  .stop{position:relative; padding-bottom:20px;}
  .stop:last-child{padding-bottom:4px;}
  .stop-icon{position:absolute; left:-28px; top:1px; width:20px; height:20px; border-radius:50%; background:var(--card-hi); border:1.5px solid var(--leg, var(--gold)); display:flex; align-items:center; justify-content:center;}
  .stop-icon svg{width:11px; height:11px; stroke:var(--sand); fill:none; stroke-width:1.8;}
  .stop-time{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--leg, var(--gold)); margin-bottom:3px;}
  .stop-name{font-size:16px; font-weight:600; color:var(--sand); margin-bottom:3px;}
  .stop-blurb{font-size:13.5px; color:var(--muted); line-height:1.45; max-width:46ch;}

  .links-list{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .links-list a{color:var(--jade); font-size:14px; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:10px; display:block;}

  .ubud-links-list{display:flex; flex-direction:column; gap:12px; margin-top:14px;}
  .ubud-links-list a{color:inherit; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:10px; display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .ubud-link-name{color:var(--jade); font-size:14px;}
  .ubud-link-dist{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted); white-space:nowrap; flex:0 0 auto;}

  .divider{max-width:640px; margin:8px auto 0; padding:0 20px;}
  .divider hr{border:none; height:1px; background:linear-gradient(to right, transparent, var(--line), transparent);}
  footer{max-width:640px; margin:30px auto 0; padding:0 20px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); text-align:center;}
  .loading{padding:60px 20px; text-align:center; color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:13px;}
</style>
</head>
<body>
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-eyebrow">Trip itinerary</div>
        <h1>Bali</h1>
        <p class="hero-sub">Ubud jungle to Nusa Dua coast — temples, rice terraces, and sunset over the sea.</p>
        <div class="hero-meta">ATL · AUH · DPS &nbsp;·&nbsp; Aug 20–30, 2026</div>
      </div>
    </div>
  </div>
  <nav class="daynav" id="dayNav"></nav>
  <main id="app"><div class="loading">Loading itinerary…</div></main>
  <footer>Bali · Aug 20–30, 2026</footer>

<script>
const ICONS = {
  flight: '<path d="M2 16l20-7-7 15-3-8-8-3z"/>',

  food: '<path d="M6 3v18M6 3c-2 0-3 2-3 4s1 3 3 3M18 3v18M18 8a3 3 0 000-6"/>',
  sight: '<path d="M4 21h16M6 21V9l6-6 6 6v12M9 21v-6h6v6"/>',
  free: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
};
const LINKS = [
  {label:'Vegetarian Guide to Bali — travel-lush.com', url:'https://travel-lush.com/vegetarian-guide-bali/'}

// Distances/times are estimates from Maya Ubud Resort & Spa (Peliatan, Ubud) — worth
// double-checking against Google Maps live traffic before locking in a day plan.
const UBUD_LINKS = [
  {label:'Sekumpul Waterfall', url:'https://www.google.com/maps/search/?api=1&query=Sekumpul+Waterfall+Bali', distance:'~75–80 km · ~2–2.5 hr'},
  {label:'The Hanging Cafe (Sekumpul)', url:'https://www.google.com/maps/search/?api=1&query=Hanging+Restaurant+Sekumpul+Bali', distance:'~75–80 km · ~2–2.5 hr'},
  {label:'Karsa Spa', url:'https://www.google.com/maps/search/?api=1&query=Karsa+Spa+Ubud+Bali', distance:'~6–7 km · ~20–25 min'},
  {label:'Mekar by K Club', url:'https://www.google.com/maps/search/?api=1&query=Mekar+by+K+Club+Ubud+Bali', distance:'~10–12 km · ~20–25 min'},
  {label:'Hesa Wellness Spa', url:'https://www.google.com/maps/search/?api=1&query=Hesa+Wellness+Spa+Ubud+Bali', distance:'~4–5 km · ~10–15 min'},
  {label:'Putri Bali Spa', url:'https://www.google.com/maps/search/?api=1&query=Putri+Bali+Spa+Ubud+Bali', distance:'~6–7 km · ~15–20 min'}

const defaultData = [
  {id:'d1', date:'Sat, Aug 22', tag:'Ubud', sub:'Arrival', leg:'ubud', stops:[
    {time:'11:25 AM', name:'Land at DPS', blurb:'', icon:'flight'},
    {time:'~1:00 PM', name:'Transfer to Ubud', blurb:'', icon:'free'},
    {time:'3:00 PM', name:'Check in — Maya Ubud Resort & Spa', blurb:'', icon:'stay'},
    {time:'5:00 PM', name:'Campuhan Ridge Walk', blurb:'Easy scenic walk, timed just before sunset.', icon:'sight'},
    {time:'Evening', name:'Dinner in central Ubud', blurb:'', icon:'food'}
  ]},
  {id:'d2', date:'Sun, Aug 23', tag:'Ubud', sub:'Temple, ATV & elephant park', leg:'ubud', stops:[
    {time:'8:00 AM', name:'Tirta Empul Temple', blurb:'Water purification ritual — bring a change of clothes / sarong.', icon:'sight'},
    {time:'10:30 AM', name:'ATV Ride — Kuber Bali Adventure', blurb:'Highly rated on TripAdvisor: jungle trails, rice fields, river, waterfall, and a 750m Dutch-era tunnel. Book ahead.', icon:'sight'},
    {time:'1:00 PM', name:'Lunch near Tegallalang', blurb:'', icon:'food'},
    {time:'2:00 PM', name:'Depart for Mason Elephant Park', blurb:'~31 min drive, 13.6 km from Kuber ATV — much closer from here than from the hotel.', icon:'free'},
    {time:'2:30 PM', name:'Mason Elephant Park & Lodge', blurb:'4/5 on TripAdvisor (~1,500 reviews). Feeding, bathing, museum — budget ~2 hrs. Reviews on the ethics are mixed despite the sanctuary branding, worth knowing going in.', icon:'sight'},
    {time:'4:30 PM', name:'Depart for hotel', blurb:'~46 min drive, 18.4 km.', icon:'free'},
    {time:'Evening', name:'Spa treatment + dinner at Maya Ubud', blurb:'~5:15 PM arrival back.', icon:'food'}
  ]},
  {id:'d3', date:'Mon, Aug 24', tag:'Ubud → Ubud', sub:'Alas Harum & Monkey Forest, hotel swap', leg:'ubud', stops:[
    {time:'7:30 AM', name:'Check out — Maya Ubud Resort & Spa', blurb:'~25 min drive to Alas Harum.', icon:'stay'},
    {time:'8:00 AM', name:'Alas Harum Bali — Tegalalang Rice Terrace', blurb:'Swings, photo spots, rice terrace views. Arriving at 8 AM beats the tour-bus crowds — budget ~3.5–4 hrs to do it properly.', icon:'sight'},
    {time:'~12:00 PM', name:'Lunch — Cretya Pool Club', blurb:'Pool club within Alas Harum, no travel needed.', icon:'food'},
    {time:'1:00 PM', name:'Depart for Monkey Forest', blurb:'~28 min drive, 12.2 km.', icon:'free'},
    {time:'1:30 PM', name:'Ubud Monkey Forest', blurb:'Allow 1–1.5 hrs walking the sanctuary.', icon:'sight'},
    {time:'~3:00 PM', name:'Check in — Viceroy Bali', blurb:'~25 min drive, 4.9 km. (Tegenungan Waterfall removed for now — it was a ~50 min detour off this route; can revisit adding it back another day.)', icon:'stay'},
    {time:'Evening', name:'Dinner — TBD', blurb:'', icon:'food'}
  ]},
  {id:'d4', date:'Tue, Aug 25', tag:'Ubud', sub:'Free day — TBD', leg:'ubud', stops:[
    {time:'9:00 AM', name:'Breakfast at Viceroy Bali', blurb:'', icon:'food'},
    {time:'Day', name:'TBD', blurb:'', icon:'free'},
    {time:'Evening', name:'Dinner — TBD', blurb:'', icon:'food'}
  ]},
  {id:'d5', date:'Wed, Aug 26', tag:'Ubud → Nusa Dua', sub:'Uluwatu & fire dance', leg:'seminyak', stops:[
    {time:'8:30 AM', name:'Breakfast at Viceroy Bali', blurb:'', icon:'food'},
    {time:'10:00 AM', name:'Check out — Viceroy Bali', blurb:'~1 hr 53 min drive to Nusa Dua — Ubud to the Bukit Peninsula is a long haul, budget accordingly.', icon:'stay'},
    {time:'12:00 PM', name:'Check in — The Ritz-Carlton, Bali (Nusa Dua)', blurb:'', icon:'stay'},
    {time:'12:45 PM', name:'Lunch nearby', blurb:'', icon:'food'},
    {time:'Afternoon', name:'Relaxed pool / beach time', blurb:'Free time at the Ritz-Carlton before heading to Uluwatu.', icon:'free'},
    {time:'3:15 PM', name:'Depart for Uluwatu', blurb:'~35 min drive, ~15 km.', icon:'free'},
    {time:'3:50 PM', name:'Uluwatu Temple', blurb:'', icon:'sight'},
    {time:'6:00 PM', name:'Kecak Fire Dance', blurb:'Book ahead — this sells out.', icon:'sight'},
    {time:'7:30 PM', name:'Dinner — TBD', blurb:'', icon:'food'},
    {time:'~9:00 PM', name:'Back to The Ritz-Carlton', blurb:'~35 min drive from Uluwatu — already checked in.', icon:'free'}
  ]},
  {id:'d6', date:'Thu, Aug 27', tag:'Nusa Dua → Seminyak → Tanah Lot', sub:'Beach day + sunset temple. Heads up: ~3h50m total driving today.', leg:'seminyak', stops:[
    {time:'9:00 AM', name:'Breakfast at The Ritz-Carlton', blurb:'', icon:'food'},
    {time:'Morning', name:'Relaxed pool / beach time', blurb:'', icon:'free'},
    {time:'12:00 PM', name:'Depart for Seminyak', blurb:'~52 min drive, 22.5 km (toll road) — this is a long haul from Nusa Dua.', icon:'free'},
    {time:'12:50 PM', name:'Explore / shop in Seminyak', blurb:'', icon:'sight'},
    {time:'2:30 PM', name:'Potato Head Beach Club', blurb:'~8 min drive, 1.8 km from Seminyak Square.', icon:'sight'},
    {time:'4:30 PM', name:'Depart for Tanah Lot', blurb:'~1 hr 3 min drive, 17.1 km.', icon:'free'},
    {time:'5:35 PM', name:'Tanah Lot Temple', blurb:'Explore the grounds before sunset (~6:00–6:15 PM this time of year — worth double-checking closer to the date).', icon:'sight'},
    {time:'~6:30 PM', name:'Depart for hotel', blurb:'~1 hr 48 min drive, 43.7 km — the return leg is the longest of the day. Consider dinner near Tanah Lot/Canggu before heading back instead of driving straight through.', icon:'free'},
    {time:'Evening', name:'Dinner', blurb:'', icon:'food'}
  ]},
  {id:'d7', date:'Fri, Aug 28', tag:'Nusa Dua → Ungasan → Jimbaran', sub:'Easy day — Sundays Beach Club', leg:'seminyak', stops:[
    {time:'9:30 AM', name:'Breakfast at The Ritz-Carlton', blurb:'', icon:'food'},
    {time:'10:00 AM', name:'Depart for Sundays Beach Club', blurb:'~22 min drive, 10.7 km.', icon:'free'},
    {time:'10:30 AM', name:'Sundays Beach Club', blurb:'Funicular down to a cliffside cove — pools, sunbeds, lunch on-site. Sun dips behind the clifftop ~4:30–5 PM, then sunset bonfire + live music 5–8 PM if you want to stay late. Whole day here is the plan — no rush.', icon:'sight'},
    {time:'~5:30 PM', name:'Depart for Jimbaran', blurb:'~34 min drive, 9.2 km.', icon:'free'},
    {time:'~6:00 PM', name:'Dinner — Jimbaran Bay seafood', blurb:'Classic Bali experience: tables on the sand, fresh-grilled seafood.', icon:'food'},
    {time:'~8:00 PM', name:'Back to hotel', blurb:'~32 min drive, 13.7 km.', icon:'free'}
  ]},
  {id:'d8', date:'Sat, Aug 29', tag:'Nusa Dua', sub:'Departure day', leg:'seminyak', stops:[
    {time:'Day', name:'TBD', blurb:'', icon:'free'},
    {time:'Evening', name:'Shower, pack, relaxed dinner near the hotel', blurb:'', icon:'free'},
    {time:'~10:00–10:30 PM', name:'Head to DPS airport', blurb:'', icon:'flight'}
  ]},
  {id:'d9', date:'Sun, Aug 30', tag:'Depart', sub:'DPS → AUH → ATL', leg:'flight', stops:[
    {time:'1:30 AM', name:'Depart DPS — EY 479', blurb:'', icon:'flight'},
    {time:'Layover', name:'Abu Dhabi', blurb:'', icon:'free'},
    {time:'9:20 AM', name:'Depart AUH — EY 13', blurb:'', icon:'flight'},
    {time:'4:30 PM EDT', name:'Land ATL', blurb:'', icon:'flight'}
  ]}
];

const data = defaultData;

function esc(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function renderNav(){
  document.getElementById('dayNav').innerHTML = data.map(d => {
    const short = d.date.replace(/^\w+,\s*/, '');
    return `<a href="#${d.id}">${short}</a>`;
  }).join('');
}

function stopView(stop){
  return `
    <div class="stop">
      <div class="stop-icon"><svg viewBox="0 0 24 24">${ICONS[stop.icon] || ICONS.free}</svg></div>
      <div class="stop-time">${esc(stop.time)}</div>
      <div class="stop-name">${esc(stop.name)}</div>
      ${stop.blurb ? `<div class="stop-blurb">${esc(stop.blurb)}</div>` : ''}
    </div>`;
}

function dayView(day){
  const stopsHtml = day.stops.map(s => stopView(s)).join('');
  return `
    <section class="day leg-${day.leg}" id="${day.id}">
      <div class="day-head">
        <span class="day-label">${esc(day.date)}</span>
        <span class="day-tag">${esc(day.tag)}</span>
      </div>
      <div class="day-sub">${esc(day.sub)}</div>
      <div class="timeline">${stopsHtml}</div>
    </section>
    <div class="divider"><hr></div>`;
}

function linksView(){
  const items = LINKS.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');
  return `
    <section class="day">
      <div class="day-head"><span class="day-label" style="font-size:22px;">Helpful Links</span></div>
      <div class="links-list">${items}</div>
    </section>`;
}

function ubudLinksView(){
  const items = UBUD_LINKS.map(l => `
    <a href="${l.url}" target="_blank" rel="noopener">
      <span class="ubud-link-name">${esc(l.label)}</span>
      <span class="ubud-link-dist">${esc(l.distance)}</span>
    </a>`).join('');
  return `
    <section class="day">
      <div class="day-head"><span class="day-label" style="font-size:22px;">Ubud Links</span></div>
      <div class="day-sub">Google Maps links + estimated distance/time from Maya Ubud Resort &amp; Spa.</div>
      <div class="ubud-links-list">${items}</div>
    </section>`;
}

function render(){
  renderNav();
  const app = document.getElementById('app');
  app.innerHTML = data.map(d => dayView(d)).join('') + ubudLinksView() + linksView();
}

render();
</script>
</body>
</html>
